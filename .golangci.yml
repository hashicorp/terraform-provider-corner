version: "2"
linters:
  default: none
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - forcetypeassert
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - staticcheck
        text: "SA1019: .*.Providers is deprecated" # (github.com/hashicorp/terraform-plugin-testing/helper/resource.TestCase).Providers
      - linters:
          - staticcheck
        text: "SA1019: .*UnsafeToUseLegacyTypeSystem is deprecated" # (github.com/hashicorp/terraform-plugin-go/tfprotov5.ApplyResourceChangeResponse).UnsafeToUseLegacyTypeSystem
  settings:
    staticcheck:
      checks:
        - all
        - '-QF1011' # could omit type *schema.Provider from declaration -- https://staticcheck.dev/docs/checks/#QF1011
        - '-ST1003' # example: "const autoTFVarsJson should be autoTFVarsJSON" -- https://staticcheck.dev/docs/checks/#ST1003
        - '-ST1005' # "error strings should not end with punctuation or newlines" -- https://staticcheck.dev/docs/checks/#ST1005
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
